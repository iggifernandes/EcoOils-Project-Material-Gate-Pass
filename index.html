<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>EcoOils Material Gate Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--panel:#ffffff;--panel2:#f4f4f4;--line:#dcdcdc;--text:#231f20;--mute:#6e6b6c;--h1:#6e6b6c;--ban:#fff4c2;--fld:#aaaaaa;--amber:#ffc600;--amber2:#7a6000;--ok:#2f7a57;--green:#44a276;--bad:#b3261e;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 Jost,system-ui,Arial,sans-serif}
input,select,button,textarea{font-family:Jost,system-ui,Arial,sans-serif}
main{max-width:640px;margin:0 auto;padding:0 16px 80px}
#hNew{display:block;width:auto;max-width:none!important;margin:14px 0 -6px auto;padding:10px 20px;min-height:44px}
@media(min-width:760px){#hNew{margin:22px 0 -48px auto;position:relative;z-index:2}}
div.phrow{display:flex;gap:8px}div.phrow select{flex:0 0 auto;width:auto;max-width:52%}div.phrow input{flex:1;min-width:0}
button.topback{width:auto;min-width:96px;min-height:40px;margin:12px 0 -6px auto;padding:6px 16px;display:block}
@media(min-width:760px){button.topback{margin:22px 0 -46px auto;position:relative;z-index:2}}
/* v1.15 screen sizes: phone as before, tablet wider, laptop uses the screen; on wide screens one pass = one line */
@media(min-width:760px){main{max-width:920px;padding:0 24px 80px}
 #vNew,#vGuide,#vDone{max-width:760px;margin-left:auto;margin-right:auto}
 .tiles{gap:16px}}
@media(min-width:1100px){main{max-width:min(1500px,96vw);padding:0 32px 80px}
 #vNew{max-width:860px}#vGuide{max-width:1000px}
 #vPass{max-width:1000px}.btn#hNew{max-width:420px}}
@media(min-width:760px){
 .pas{min-height:52px;padding:10px 16px}
 .pas>span{display:flex;align-items:baseline;gap:20px;flex:1;min-width:0;flex-wrap:nowrap}
 .pas>span>b{flex:0 0 190px;white-space:nowrap}
 .pas>span>small{display:block;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
 .pas>span>small br{display:none}
 .pas .chip{flex:none;margin-left:auto}}
h1{font-weight:300;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--h1);margin:0 0 16px;padding:26px 0 14px;border-bottom:1px solid var(--text);position:relative;line-height:1.25}
h1::after{content:"";position:absolute;left:0;bottom:-4px;width:44px;height:7px;background:var(--green)}
@media(max-width:420px){h1{font-size:18px;letter-spacing:.1em}}
h2{font-weight:500;font-size:17px;margin:20px 0 6px}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 4px}
input,select,textarea{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--fld);border-radius:var(--r);padding:11px;font-size:16px;min-height:48px}
textarea{min-height:84px;resize:vertical;line-height:1.4}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
input.bad,select.bad,textarea.bad{border-color:var(--bad);border-width:2px}
.btn{display:block;width:100%;background:var(--green);color:var(--text);border:1px solid var(--green);border-radius:var(--r);padding:13px 15px;min-height:52px;font-weight:600;font-size:17px;cursor:pointer;margin-top:12px;text-align:center;text-decoration:none}
.btn:hover{background:#3b9068}
.btn.amber{background:var(--amber);border-color:var(--amber)}.btn.amber:hover{background:#e6b400}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--fld);font-size:15px;padding:10px;font-weight:500;min-height:48px}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{background:var(--panel);border:1px solid var(--bad);color:var(--bad);font-size:15px;font-weight:500;min-height:48px}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:4px 6px 0 0;min-height:40px}
.btn:disabled{opacity:.45;cursor:default}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{color:var(--mute);font-size:14px;margin:6px 0}
.err{color:var(--bad);font-size:15px;margin:8px 0;font-weight:500}
.banner{border-radius:var(--r);padding:10px 12px;margin:8px 0;font-size:15px;background:var(--ban);border:1px solid var(--amber)}
.hidden{display:none!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px}
.steps{display:flex;gap:6px;margin:0 0 4px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--green)}
.stepl{font-size:14px;color:var(--mute);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tile{border:2px solid var(--fld);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:var(--panel);font-weight:500;position:relative}
.tile.on{border-color:var(--green)}
.tile.sel{background:var(--green);border-color:var(--green)}
.tile img{width:100%;height:110px;object-fit:contain;background:#111;border-radius:6px;margin-bottom:4px}
.tile small{color:var(--mute);font-weight:400}.tile.sel small{color:var(--text)}
.tile .ck{position:absolute;top:6px;right:8px;color:var(--ok);font-weight:700;font-size:20px}
.tile input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.ph{border:2px dashed var(--fld);background:var(--panel2)}
.irow{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-top:10px;background:var(--panel)}
.irow .row3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--fld);white-space:nowrap}
.chip.wait{background:var(--ban);border-color:var(--amber)}.chip.pend{border-color:var(--green);color:var(--ok)}.chip.rel{background:var(--green);border-color:var(--green)}.chip.bad{border-color:var(--bad);color:var(--bad)}.chip.off{color:var(--mute)}
.pas{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:8px 0;cursor:pointer;width:100%;text-align:left;font-size:16px;min-height:60px}
.pas b{font-weight:600}.pas small{display:block;color:var(--mute);font-size:13px}
.ref{font-size:30px;font-weight:300;letter-spacing:.06em;text-align:center;margin:10px 0}
.big{font-size:22px;font-weight:600;text-align:center;line-height:1.2;margin:0 0 6px}
.vbox{border-radius:var(--r);padding:22px 16px;margin-top:14px;text-align:center;border:2px solid var(--line)}
.vbox.ok{background:var(--green);border-color:var(--green)}.vbox.wait{background:var(--ban);border-color:var(--amber)}.vbox.bad{background:#fbe9e7;border-color:var(--bad);color:var(--bad)}
table.it{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}table.it th,table.it td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}table.it th{background:var(--panel2);font-weight:500}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:15px}.kv span:nth-child(odd){color:var(--mute)}.kv span{overflow-wrap:anywhere}
.sp{display:inline-block;width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.links{margin-top:22px;text-align:center}
.links button{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;min-height:44px;text-decoration:underline;cursor:pointer}
.qr{display:block;margin:10px auto;width:180px;height:180px}
.pv{position:relative}.pv img{width:100%;border:1px solid var(--line);border-radius:6px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--fld);border-radius:var(--r);padding:12px;margin-top:8px;cursor:pointer;background:var(--panel);min-height:56px;width:100%;text-align:left;font-size:16px}
.opt.sel{border-color:var(--green);background:#eef7f2}.opt b{min-width:24px}
.scroll{overflow-x:auto}
.adm td,.adm th{font-size:13px}
#printArea{display:none}
.ovl{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column}
.ovl.hidden{display:none}
.ovbar{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px;z-index:3;background:linear-gradient(#000a,#0000)}
.ovbar button{min-width:46px;min-height:46px;border-radius:999px;border:1px solid #fff8;background:#0008;color:#fff;font:600 22px Jost,Arial,sans-serif;cursor:pointer}
.zmst{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.zmst img{max-width:100%;max-height:100%;transform-origin:center;user-select:none;-webkit-user-drag:none}
#scn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scF{position:absolute;border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 100vmax #0009;z-index:2;pointer-events:none}
#scT{margin-right:auto;font-weight:300;letter-spacing:.14em;text-transform:uppercase;color:#fff;padding-left:6px}
#scMsg{position:absolute;left:12px;right:12px;bottom:112px;text-align:center;font-size:14px;z-index:3;text-shadow:0 1px 3px #000}
#scP{position:absolute;inset:56px 0 120px;margin:auto;max-width:100%;max-height:calc(100% - 176px);background:#fff;z-index:2}
.scbt{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;align-items:center;padding:14px;z-index:3;background:linear-gradient(#0000,#000b)}
.scbt .btn{width:auto;margin:0;padding:0 18px}
#scShot{width:68px;height:68px;border-radius:50%;border:5px solid #fff;background:#fff3;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
img[data-zoom]{cursor:zoom-in}
.gstep{display:flex;gap:12px;margin:10px 0}.gstep i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-weight:600;display:flex;align-items:center;justify-content:center}.gstep b{display:block;font-weight:600}.gstep span{font-size:15px}
.gl{list-style:none;margin:8px 0 0;padding:0}.gl li{position:relative;padding:8px 0 8px 32px;border-top:1px solid var(--line);font-size:16px}.gl li:first-child{border-top:0}.gl li:before{position:absolute;left:2px;top:6px;font-weight:700;font-size:20px}
.gl.gn{counter-reset:g}.gl.gn li:before{counter-increment:g;content:counter(g)".";font-size:16px;color:var(--mute);top:9px}
.gdo{border-left:5px solid var(--green)}.gdo .gl li:before{content:"\2713";color:var(--ok)}.gdn{border-left:5px solid var(--bad)}.gdn .gl li:before{content:"\2717";color:var(--bad)}

#qrs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#qrBox{position:absolute;left:50%;top:50%;width:62vmin;height:62vmin;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 100vmax #0007;z-index:2;pointer-events:none}
#qrMsg{position:absolute;left:12px;right:12px;bottom:40px;text-align:center;font-size:15px;z-index:3;text-shadow:0 1px 3px #000}
.adrow{display:flex;align-items:center;gap:8px}.adrow input[type=checkbox]{width:24px;height:24px;flex:none;margin:0}.adrow .pas{flex:1;min-width:0}

@media print{
 @page{size:A4;margin:0}
 html,body{background:#fff!important;margin:0!important}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;color:#000}
}
#printArea .pg{font-family:Jost,Arial,Helvetica,sans-serif;font-size:10pt;color:#000;width:100%;line-height:1.3;box-sizing:border-box;padding:8mm 10mm 6mm;height:296mm;display:flex;flex-direction:column;overflow:hidden}
#printArea .pg>.ft{margin-top:auto}
#printArea table{border-collapse:collapse;width:100%}
#printArea .hd td{border:1px solid #000;padding:2px 6px;font-size:9pt;vertical-align:middle}
#printArea .hd td.lg{width:48%;border-right:0;border-top:0;border-left:0;border-bottom:0}
#printArea .hd td.lg img{height:15mm;display:block}
#printArea .hd td.k{width:16%;border:0;padding:1px 4px}
#printArea .hd td.v{border:0;padding:1px 4px}
#printArea .addr{font-size:9pt;margin:8px 0 6px}
#printArea .ttl{text-align:center;font-weight:600;font-size:14pt;letter-spacing:.04em;margin:8px 0 8px;text-decoration:underline}
#printArea .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#printArea .top svg{width:26mm;height:26mm;flex:none}
#printArea .ln{margin:3px 0}
#printArea .u{display:inline-block;border-bottom:1px solid #000;min-width:30mm;padding:0 3px;font-weight:600}
#printArea .chk{display:inline-block;width:3.6mm;height:3.6mm;border:1px solid #000;margin-right:6px;vertical-align:-0.5mm;text-align:center;line-height:3.4mm;font-size:9pt;font-weight:700}
#printArea .items th,#printArea .items td{border:1px solid #000;padding:2px 6px;font-size:9.5pt;height:6.2mm}
#printArea .items th{font-weight:700;text-align:center}
#printArea .sig{display:flex;gap:10mm;margin-top:5mm}
#printArea .sig>div{flex:1;min-height:21mm}
#printArea .sig .l{border-bottom:1px solid #000;height:11mm;margin-bottom:2px}
#printArea .sig small{font-size:8.5pt;font-style:italic;display:block}
#printArea .ft{margin-top:3mm;font-size:9pt;display:flex;justify-content:space-between;align-items:flex-end}
#printArea .ph2{display:flex;gap:6mm;margin-top:3mm}#printArea .ph2>div{flex:1}#printArea .ph2 .pi{height:40mm;border:1px solid #000;overflow:hidden;display:flex;align-items:center;justify-content:center}#printArea .ph2 img{width:100%;height:100%;object-fit:contain;display:block}#printArea .ph2 small{font-size:8pt;font-style:italic;display:block;text-align:center}
#printArea .pg.cmp .ph2 .pi{height:30mm}
#printArea .pg.cmp{font-size:9pt}
#printArea .pg.cmp .items th,#printArea .pg.cmp .items td{font-size:8pt;padding:1px 4px;height:4.9mm;line-height:1.15}
#printArea .pg.cmp .hd td.lg img{height:12mm}
#printArea .pg.cmp .addr{font-size:8pt;margin:4px 0 3px}
#printArea .pg.cmp .ttl{margin:4px 0 5px;font-size:13pt}
#printArea .pg.cmp .top svg{width:22mm;height:22mm}
#printArea .pg.cmp .ln{margin:1px 0}
#printArea .pg.cmp .sig{margin-top:4mm}
#printArea .pg.cmp .sig>div{min-height:19mm}
#printArea .pg.cmp .sig .l{height:9mm}
#printArea .pn{font-size:9pt}
#printArea .pg+.pg{page-break-before:always;break-before:page}
#printArea .pg2 .ttl{margin:6mm 0 4mm}
#printArea .bigph{margin-top:5mm;text-align:center}#printArea .bigph .pi{width:107mm;height:80mm;margin:0 auto;border:1px solid #000;display:flex;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box}#printArea .bigph img{width:100%;height:100%;object-fit:contain;display:block}#printArea .bigph small{display:block;font-size:9pt;font-style:italic;margin-top:1.5mm}
/* eco-std-header */
header.eh{background:#fff;color:#231f20;padding:10px 16px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid #dcdcdc;position:relative;z-index:5;margin:0;width:auto;max-width:none;height:auto;min-height:0;box-shadow:none;font-family:Jost,system-ui,Arial,sans-serif;font-size:16px;line-height:1.45}
header.eh .eh-logo{height:44px;width:auto;max-width:58%;object-fit:contain;display:block;margin:0}
header.eh .eh-r{display:flex;flex-direction:column;align-items:flex-end;gap:0;margin-left:auto}
header.eh .eh-v{font-size:12px;letter-spacing:.08em;color:#6e6b6c;line-height:1.2;padding:2px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:400;background:none;border:0}
header.eh .eh-d{font-size:11px;letter-spacing:.06em;color:#aaaaaa;line-height:1.2;padding:2px 0 0;white-space:nowrap;font-variant-numeric:tabular-nums}
header.eh .eh-l{display:flex;gap:0;margin:0;padding:0;background:none;border:0}
header.eh .eh-l button{background:none;color:#6e6b6c;border:0;border-bottom:3px solid transparent;border-radius:0;min-width:44px;min-height:44px;padding:0 8px;margin:0;font:400 15px/1 Jost,system-ui,Arial,sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:none;opacity:1;text-transform:none}
header.eh .eh-l button.on,header.eh .eh-l button.active,header.eh .eh-l button[aria-pressed="true"]{color:#231f20;font-weight:600;border-bottom-color:#44a276;background:none}

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

            } else {

              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };

/* ===== Download PDF: the same pages as the print, drawn to pictures and packed into a PDF (no library, no paid service) ===== */
function printCss(){
  var o='';
  Array.prototype.forEach.call(document.styleSheets,function(ss){try{Array.prototype.forEach.call(ss.cssRules,function(r){
    if(r.type===4){if(/print/.test(r.media.mediaText))Array.prototype.forEach.call(r.cssRules,function(q){if(q.selectorText&&q.selectorText.indexOf('#printArea')===0)o+=q.cssText;});}
    else if(r.selectorText&&r.selectorText.indexOf('#printArea')===0&&r.cssText.indexOf('display: none')<0)o+=r.cssText;
  });}catch(e){}});
  return o;
}
/* Jost for the PDF pictures (a picture cannot use web fonts by link, so the font file is fetched once and embedded); falls back to Arial when offline */
var JOST=null;
function jostCss(){
  if(JOST!==null)return Promise.resolve(JOST);
  return new Promise(function(res){
    var fin=function(v){if(JOST===null){JOST=v||'';res(JOST);}};setTimeout(function(){fin('');},6000);
    var l=document.querySelector('link[href*="fonts.googleapis.com/css2"]');if(!l||!window.fetch)return fin('');
    fetch(l.href).then(function(r){return r.text();}).then(function(css){
      var parts=css.split(/\/\*\s*/).filter(function(x){return /^latin\s*\*\//.test(x);});
      return Promise.all(parts.map(function(b){
        var m=b.match(/url\((https:[^)]+)\)/);if(!m)return '';
        return fetch(m[1]).then(function(r){return r.arrayBuffer();}).then(function(buf){
          var u=new Uint8Array(buf),bin='';for(var i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
          return b.replace(/^latin\s*\*\//,'').replace(m[0],'url(data:font/woff2;base64,'+btoa(bin)+')');
        });
      }));
    }).then(function(a){fin(a.join('\n'));},function(){fin('');});
  });
}
function pageJpeg(pgHtml,css){
  return new Promise(function(res,rej){
    var W=794,H=1123,box=document.createElement('div');
    box.innerHTML='<style>'+css+'</style><div id="printArea" style="display:block;width:'+W+'px;height:'+H+'px;background:#fff;color:#000;overflow:hidden">'+pgHtml+'</div>';
    var xml=new XMLSerializer().serializeToString(box);
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'"><foreignObject x="0" y="0" width="'+W+'" height="'+H+'">'+xml+'</foreignObject></svg>';
    var im=new Image();
    im.onload=function(){try{
      var c=document.createElement('canvas');c.width=W*2;c.height=H*2;var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      var b=atob(c.toDataURL('image/jpeg',0.9).split(',')[1]),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      res({jpg:u,w:c.width,h:c.height});
    }catch(e){rej(e);}};
    im.onerror=function(){rej(new Error('render'));};
    im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function mkPdf(pages,title){
  var parts=[],len=0,offs=[];
  var put=function(x){var u=typeof x==='string'?(function(){var a=new Uint8Array(x.length);for(var i=0;i<x.length;i++)a[i]=x.charCodeAt(i)&255;return a;})():x;parts.push(u);len+=u.length;};
  var N=pages.length*3+4;
  put('%PDF-1.4\n');
  var obj=function(n,body){offs[n]=len;put(n+' 0 obj\n'+body+'\nendobj\n');};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map(function(_,i){return (3+i*3)+' 0 R';}).join(' ')+'] >>');
  pages.forEach(function(pg,i){
    var a=3+i*3;
    obj(a,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+(a+2)+' 0 R >> >> /Contents '+(a+1)+' 0 R >>');
    var cs='q 595.28 0 0 841.89 0 0 cm /Im0 Do Q';
    obj(a+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[a+2]=len;put((a+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+pg.w+' /Height '+pg.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+pg.jpg.length+' >>\nstream\n');put(pg.jpg);put('\nendstream\nendobj\n');
  });
  obj(N-1,'<< /Title ('+String(title).replace(/[()\\]/g,'')+') /Producer (EcoOils Material Gate Pass) >>');
  var xr=len;put('xref\n0 '+N+'\n0000000000 65535 f \n');
  for(var k=1;k<N;k++)put(('0000000000'+offs[k]).slice(-10)+' 00000 n \n');
  put('trailer\n<< /Size '+N+' /Root 1 0 R /Info '+(N-1)+' 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
function saveBlob(blob,name){
  var a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},5000);
}

  if(!QS.load)QS.load=new Promise(function(ok,no){var e=document.createElement('script');e.src='jsQR.js';e.onload=ok;e.onerror=function(){QS.load=null;no();};document.head.appendChild(e);});
  return QS.load;
}
function qrScanClose(){
  QS.on=false;if(QS.stream){QS.stream.getTracks().forEach(function(t){t.stop();});QS.stream=null;}
  if(QS.el)QS.el.classList.add('hidden');
}
function qrScanOpen(cb){
  if(!QS.el){
    var d=document.createElement('div');d.id='qrs';d.className='ovl hidden';
    d.innerHTML='<div class="ovbar"><span id="qrT" style="margin-right:auto;font-weight:300;letter-spacing:.14em;text-transform:uppercase;padding-left:6px"></span><button class="btn ghost sm" id="qrX" type="button" style="width:auto;margin:0">&times;</button></div><video id="qrV" playsinline muted></video><div id="qrBox"></div><div id="qrMsg"></div><canvas id="qrC" class="hidden"></canvas>';
    document.body.appendChild(d);QS.el=d;d.querySelector('#qrX').onclick=qrScanClose;
  }
  QS.cb=cb;var d2=QS.el;d2.classList.remove('hidden');d2.querySelector('#qrT').textContent=tr('scanQr');d2.querySelector('#qrMsg').textContent=tr('qrHelp');
  try{if(!QS.det&&window.BarcodeDetector)QS.det=new BarcodeDetector({formats:['qr_code']});}catch(e){QS.det=null;}
  (QS.det?Promise.resolve():qrLoadLib()).then(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});}).then(function(st){
    QS.stream=st;var v=d2.querySelector('#qrV');v.srcObject=st;return v.play();
  }).then(function(){QS.on=true;qrLoop();},function(){d2.querySelector('#qrMsg').textContent=tr('camErr');});
}
function qrGot(raw){
  var m=String(raw||'').match(REFRE);
  if(!m){QS.el.querySelector('#qrMsg').textContent=tr('qrNone');setTimeout(function(){if(QS.stream){QS.on=true;QS.el.querySelector('#qrMsg').textContent=tr('qrHelp');qrLoop();}},1500);return;}
  var f=QS.cb;qrScanClose();if(f)f(m[0].toUpperCase());
}
function qrLoop(){
  if(!QS.on)return;
  var v=QS.el.querySelector('#qrV'),c=QS.el.querySelector('#qrC');
  if(v.readyState>=2&&v.videoWidth){
    if(QS.det){QS.det.detect(v).then(function(r){if(!QS.on)return;if(r&&r.length&&r[0].rawValue){QS.on=false;qrGot(r[0].rawValue);}else setTimeout(qrLoop,150);},function(){QS.det=null;setTimeout(qrLoop,150);});return;}
    if(window.jsQR){
      var w=Math.min(640,v.videoWidth),h=Math.round(w*v.videoHeight/v.videoWidth);if(c.width!==w)c.width=w;if(c.height!==h)c.height=h;
      var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);
      var im=x.getImageData(0,0,w,h),r=jsQR(im.data,w,h,{inversionAttempts:'dontInvert'});
      if(r&&r.data){QS.on=false;qrGot(r.data);return;}
    }
  }
  setTimeout(qrLoop,180);
}

var VREF='',VRES=null;

function verifyOpen(ref,k){
  if(ref!==VREF){VSG=[];VAUTO=false;VMSG='';}
  VREF=ref;VK=k||'';VRES=null;$('vPass').innerHTML='';show('vVerify');verifyDraw();api({action:'verify',ref:ref,k:VK}).then(function(r){VRES=r||{ok:false};verifyDraw();
    /* scanned from the paper and not yet signed-and-uploaded: go straight to the scanner */
    if(VRES.ok&&VRES.upload&&!VAUTO&&!VSG.length){VAUTO=true;scanOpen(function(p){VSG.push(p);verifyDraw();});}
  },function(){VRES={ok:false,err:'net'};verifyDraw();});}

  else if(!VRES.found)h+='<div class="vbox bad"><div class="big">'+esc(tr('v_nf'))+'</div><div>'+esc(tr('v_nf2'))+'</div></div>';
  else{
    var s=VRES.status,cls=s==='Pending release'?'ok':s==='Released'?'ok':s==='Awaiting signatures'?'wait':'bad';
    var k=s==='Pending release'?['v_ready','v_ready2']:s==='Released'?['v_rel','']:s==='Awaiting signatures'?['v_wait','v_wait2']:s==='Rejected'?['v_rej','']:s==='Cancelled'?['v_can','']:['v_exp',''];

/* ===== photo viewer: zoom in / out, pinch, drag, double-tap ===== */
var ZM={el:null,img:null,s:1,x:0,y:0,pt:{},d0:0,s0:1};
function zmApply(){if(ZM.s<=1){ZM.s=1;ZM.x=0;ZM.y=0;}ZM.img.style.transform='translate('+ZM.x+'px,'+ZM.y+'px) scale('+ZM.s+')';}
function zmSet(s){ZM.s=Math.max(1,Math.min(6,s));zmApply();}
function zmBuild(){
  if(ZM.el)return;
  var d=document.createElement('div');d.id='zm';d.className='ovl hidden';
  d.innerHTML='<div class="ovbar"><button type="button" id="zmOut" aria-label="Zoom out">&minus;</button><button type="button" id="zmIn" aria-label="Zoom in">+</button><button type="button" id="zmRs">1:1</button><button type="button" id="zmX" aria-label="Close">&times;</button></div><div class="zmst"><img alt="" id="zmImg"></div>';
  document.body.appendChild(d);ZM.el=d;ZM.img=d.querySelector('#zmImg');
  var st=d.querySelector('.zmst');
  d.querySelector('#zmIn').onclick=function(){zmSet(ZM.s*1.5);};
  d.querySelector('#zmOut').onclick=function(){zmSet(ZM.s/1.5);};
  d.querySelector('#zmRs').onclick=function(){zmSet(1);};
  d.querySelector('#zmX').onclick=zoomClose;
  st.addEventListener('wheel',function(e){e.preventDefault();zmSet(ZM.s*(e.deltaY<0?1.2:1/1.2));},{passive:false});
  st.addEventListener('dblclick',function(){zmSet(ZM.s>1?1:2.5);});
  st.addEventListener('pointerdown',function(e){try{st.setPointerCapture(e.pointerId);}catch(x){}ZM.pt[e.pointerId]={x:e.clientX,y:e.clientY};var k=Object.keys(ZM.pt);if(k.length===2){var a=ZM.pt[k[0]],b=ZM.pt[k[1]];ZM.d0=Math.hypot(a.x-b.x,a.y-b.y);ZM.s0=ZM.s;}});
  st.addEventListener('pointermove',function(e){
    var p=ZM.pt[e.pointerId];if(!p)return;var k=Object.keys(ZM.pt);
    if(k.length===2){ZM.pt[e.pointerId]={x:e.clientX,y:e.clientY};var a=ZM.pt[k[0]],b=ZM.pt[k[1]],dd=Math.hypot(a.x-b.x,a.y-b.y);if(ZM.d0>0)zmSet(ZM.s0*dd/ZM.d0);}
    else if(ZM.s>1){ZM.x+=e.clientX-p.x;ZM.y+=e.clientY-p.y;ZM.pt[e.pointerId]={x:e.clientX,y:e.clientY};zmApply();}
  });
  var up=function(e){delete ZM.pt[e.pointerId];};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
}
function zoomOpen(src){if(!src)return;zmBuild();ZM.img.src=src;ZM.s=1;ZM.x=0;ZM.y=0;zmApply();ZM.pt={};ZM.el.classList.remove('hidden');}
function zoomClose(){if(ZM.el)ZM.el.classList.add('hidden');}
document.addEventListener('click',function(e){var im=e.target&&e.target.closest&&e.target.closest('img[data-zoom]');if(im){e.preventDefault();zoomOpen(im.getAttribute('data-zoom'));}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){zoomClose();scanClose();qrScanClose();}});

/* ===== document scanner for the signed copy: camera with a page frame, cropped to the frame, cleaned up like a scan ===== */
var SC={el:null,stream:null,cb:null,shot:null};
function scanClose(){if(SC.stream){SC.stream.getTracks().forEach(function(t){t.stop();});SC.stream=null;}if(SC.el)SC.el.classList.add('hidden');SC.shot=null;}
function scanBuild(){
  if(SC.el)return;
  var d=document.createElement('div');d.id='scn';d.className='ovl hidden';
  d.innerHTML='<video id="scV" playsinline muted autoplay></video><div id="scF"></div><div class="ovbar"><span id="scT"></span><button type="button" id="scX" aria-label="Close">&times;</button></div><div id="scMsg"></div><img id="scP" alt="" class="hidden"><div class="scbt"><button type="button" class="btn ghost" id="scFile"></button><button type="button" id="scShot" aria-label="Capture"></button><button type="button" class="btn ghost hidden" id="scRe"></button><button type="button" class="btn hidden" id="scUse"></button></div>';
  document.body.appendChild(d);SC.el=d;
  d.querySelector('#scX').onclick=scanClose;
  d.querySelector('#scFile').onclick=function(){scanClose();var fi=$('sgIn');if(fi)fi.click();};
  d.querySelector('#scShot').onclick=scanShot;
  d.querySelector('#scRe').onclick=function(){scanMode('live');};
  d.querySelector('#scUse').onclick=function(){var s=SC.shot,cb=SC.cb;scanClose();if(s&&cb)cb(s);};
}
function scanMode(m){
  var d=SC.el;d.querySelector('#scV').classList.toggle('hidden',m!=='live');d.querySelector('#scF').classList.toggle('hidden',m!=='live');
  d.querySelector('#scP').classList.toggle('hidden',m!=='prev');d.querySelector('#scShot').classList.toggle('hidden',m!=='live');d.querySelector('#scFile').classList.toggle('hidden',m!=='live');
  d.querySelector('#scRe').classList.toggle('hidden',m!=='prev');d.querySelector('#scUse').classList.toggle('hidden',m!=='prev');
  d.querySelector('#scMsg').textContent=m==='live'?tr('scanHelp'):tr('scanCheck');
}
function scanOpen(cb){
  scanBuild();SC.cb=cb;SC.shot=null;var d=SC.el;
  d.querySelector('#scT').textContent=tr('scanTitle');d.querySelector('#scFile').textContent=tr('scanFile');d.querySelector('#scRe').textContent=tr('scanRetake');d.querySelector('#scUse').textContent=tr('scanUse');
  d.classList.remove('hidden');
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){scanClose();var fi=$('sgIn');if(fi)fi.click();return;}
  scanMode('live');d.querySelector('#scMsg').textContent=tr('scanStart');
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1920}},audio:false}).then(function(st){
    SC.stream=st;var v=d.querySelector('#scV');v.srcObject=st;v.play&&v.play().catch(function(){});scanMode('live');scanFrame();
  },function(){scanClose();var fi=$('sgIn');if(fi){alert(tr('scanNoCam'));fi.click();}});
}
function scanFrame(){
  var d=SC.el,cw=d.clientWidth,ch=d.clientHeight,fh=Math.min(ch-210,(cw*0.92)*1.414),fw=fh/1.414,f=d.querySelector('#scF');
  f.style.width=Math.round(fw)+'px';f.style.height=Math.round(fh)+'px';f.style.left=Math.round((cw-fw)/2)+'px';f.style.top=Math.round(Math.max(56,(ch-fh)/2-30))+'px';
}
window.addEventListener('resize',function(){if(SC.el&&!SC.el.classList.contains('hidden'))scanFrame();});
function scanShot(){
  var d=SC.el,v=d.querySelector('#scV'),f=d.querySelector('#scF');if(!v.videoWidth){return;}
  var cr=d.getBoundingClientRect(),fr=f.getBoundingClientRect(),vw=v.videoWidth,vh=v.videoHeight,cw=cr.width,ch=cr.height,sc=Math.max(cw/vw,ch/vh),ox=(vw*sc-cw)/2,oy=(vh*sc-ch)/2;
  var sx=Math.max(0,(fr.left-cr.left+ox)/sc),sy=Math.max(0,(fr.top-cr.top+oy)/sc),sw=Math.min(vw-sx,fr.width/sc),sh=Math.min(vh-sy,fr.height/sc);
  var k=Math.min(1,1700/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  var x=c.getContext('2d');x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  SC.shot=c.toDataURL('image/jpeg',0.8).split(',')[1];   /* colour copy: no grey, no black-and-white */
  d.querySelector('#scP').src='data:image/jpeg;base64,'+SC.shot;scanMode('prev');
}
